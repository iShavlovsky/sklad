# ──────────────────────────────────────────
#  SonarQube / SonarCloud project settings
# ──────────────────────────────────────────

# Project identification
sonar.projectKey=sklad-next
sonar.projectName=Sklad Next
sonar.projectVersion=0.1.0-beta.1

# Sources
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts

# Test sources (uncomment when tests are added)
# sonar.tests=src
# sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage (uncomment when vitest + coverage is set up)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ESLint report (generated by: npm run lint:report)
sonar.eslint.reportPaths=eslint-report.json

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/out/**,\
  **/coverage/**,\
  **/*.config.{js,ts,mjs,cjs},\
  **/*.d.ts,\
  **/public/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/vite-env.d.ts

# Don't analyze test files as sources
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/main.tsx

# CPD (copy-paste detection) — skip test files
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx
